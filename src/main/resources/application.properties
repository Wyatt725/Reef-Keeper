spring.application.name=reef-keeper
server.port=8080

# The Fish Game API. out=json asks for JSON; base64=yes embeds the image in the reply.
fish.api.url=https://marcconrad.com/uob/fish/api.php?out=json&base64=yes

# Week 6: accounts are saved in a database file in the project's data folder
spring.datasource.url=jdbc:h2:file:./data/reefkeeper
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
# The session cookie: hidden from JavaScript, not sent with requests from other sites
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
