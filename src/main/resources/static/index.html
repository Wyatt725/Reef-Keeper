<!DOCTYPE html>
<!--
  Reef Keeper - CIS045-3 coursework.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reef Keeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="ui.css">
</head>
<body>
<header id="topbar" class="topbar" data-page="aquarium"></header>

<main class="game">
    <p id="message" class="message" aria-live="polite"></p>

    <!-- Deliveries waiting (wireframe 02, note 3) -->
    <section class="banner">
        <div>
            <strong><span id="waiting">0</span> deliveries waiting</strong>
            <div class="hint">Next delivery in <span id="next-in">-</span></div>
        </div>
        <button id="open-delivery" type="button">Open delivery</button>
    </section>

    <!-- Open delivery: count the fish (wireframe 03). Hidden until opened. -->
    <section id="delivery-panel" class="panel" hidden>
        <div class="panel-head">
            <h2>Delivery #<span id="delivery-id"></span></h2>
            <span class="timer">Driver leaves in <strong id="delivery-timer">30</strong> s</span>
        </div>
        <img id="delivery-image" alt="Delivery crate: count the fish">
        <form id="count-form">
            <label for="count-input">How many fish are in this crate? <span class="hint">Don't count the treasure chests.</span></label>
            <div class="row">
                <input id="count-input" type="number" min="0" max="99" required autocomplete="off">
                <button type="submit">Accept delivery</button>
            </div>
        </form>
    </section>

    <!-- Treasure check after a right count (wireframe 04). Opened by showTreasureCheck() in treasure.js. -->
    <section id="treasure-panel" class="panel treasure" hidden>
        <div class="panel-head">
            <h2>Correct! <span id="treasure-fish"></span> fish accepted.</h2>
            <span class="soon">Chest check coming in Week 9</span>
        </div>
        <img id="treasure-image" alt="The same delivery crate: count the treasure chests">
        <label for="chest-input">Bonus: how many treasure chests? <span class="hint">Each chest becomes a decoration.</span></label>
        <div class="row">
            <input id="chest-input" type="number" min="0" max="99" disabled>
            <button type="button" disabled>Check</button>
            <button id="treasure-skip" type="button">Skip</button>
        </div>
    </section>

    <!-- Accepted fish waiting for a tank (wireframe 05). Filled in by renderGame(). -->
    <section id="place-panel" class="panel" hidden>
        <h2>Where should the <span id="place-fish"></span> new fish go?</h2>
        <div id="place-tanks" class="tank-buttons"></div>
    </section>

    <!-- The tanks (wireframe 02, note 4). Filled in by renderGame(). -->
    <h2>Your tanks</h2>
    <section id="tanks" class="tanks"></section>
    <a class="add-tank" href="shop.html">+ Buy another tank</a>
</main>

<script src="account.js"></script>
<script src="nav.js"></script>
<script src="treasure.js"></script>
<script src="aquarium.js"></script>
</body>
</html>
