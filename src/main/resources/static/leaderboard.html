<!DOCTYPE html>
<!--
  Reef Keeper - CIS045-3 coursework.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reef Keeper - Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="ui.css">
</head>
<body>
<header id="topbar" class="topbar" data-page="leaderboard"></header>

<main>
    <div class="page-head">
        <h2>Top aquariums</h2>
    </div>

    <div class="table-wrap">
        <table class="board">
            <thead>
            <tr><th>Rank</th><th>Keeper</th><th>Fish</th><th>Decorations</th><th>Value</th></tr>
            </thead>
            <tbody>
            <tr class="me">
                <td>-</td>
                <td>You (<span id="my-name">-</span>)</td>
                <td id="my-fish">-</td>
                <td id="my-decorations">-</td>
                <td id="my-value">-</td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="hint">Value = 10 per fish + 25 per decoration + the price of each tank.</p>
    <p><a class="add-tank" href="/">Back to your aquarium</a></p>
</main>

<script src="account.js"></script>
<script src="nav.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
