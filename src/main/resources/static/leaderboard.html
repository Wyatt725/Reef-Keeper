<!DOCTYPE html>
<!--
  Reef Keeper - CIS045-3 coursework.
  Leaderboard screen (wireframe 07): the top 10 aquariums by value, plus your own row.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reef Keeper - Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="ui.css">
</head>
<body>
<header id="topbar" class="topbar" data-page="leaderboard"></header>

<main>
    <div class="page-head">
        <h2>Top aquariums</h2>
        <span class="hint">Your row is highlighted.</span>
    </div>

    <div class="table-wrap">
        <table class="board">
            <thead>
            <tr>
                <th class="num">Rank</th>
                <th>Keeper</th>
                <th class="num">Fish</th>
                <th class="num col-decor">Decorations</th>
                <th class="num">Value</th>
            </tr>
            </thead>
            <tbody id="board-rows">
            <tr><td colspan="5" class="later">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <p class="hint">Value = 10 per fish + 25 per decoration + the price of each tank.</p>
</main>

<script src="account.js"></script>
<script src="toast.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
