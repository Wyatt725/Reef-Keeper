<!DOCTYPE html>
<!--
  Reef Keeper - CIS045-3 coursework.
  Source: generated with Claude (Anthropic AI), 31 Oct 2026; every player's ranking added 3 Nov 2026. Complete as given.
  Leaderboard screen (wireframe 07): the top 10 aquariums by value, plus your own row.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reef Keeper - Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="ui.css">
</head>
<body>
<header id="topbar" class="topbar" data-page="leaderboard"></header>

<main>
    <div class="page-head">
        <h2>Top aquariums</h2>
        <span class="hint">Your row is highlighted.</span>
    </div>

    <p id="board-message" class="message" aria-live="polite"></p>

    <div class="table-wrap">
        <table class="board">
            <thead>
            <tr><th>Rank</th><th>Keeper</th><th>Fish</th><th>Decorations</th><th>Value</th></tr>
            </thead>
            <tbody id="board-rows">
            <tr><td colspan="5" class="later">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <p class="hint">Value = 10 per fish + 25 per decoration + the price of each tank.</p>
    <p><a class="add-tank" href="/">Back to your aquarium</a></p>
</main>

<script src="account.js"></script>
<script src="nav.js"></script>
<script src="api.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
